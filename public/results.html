<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Live results</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      main {
        width: min(100% - 32px, 64rem);
      }

      .heading {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .heading .lede {
        margin: 0;
      }

      .heading a {
        color: inherit;
      }

      .tier-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        background: var(--surface);
        border-radius: var(--radius);
      }

      .tier-count {
        display: grid;
        place-items: center;
        min-width: 4.5rem;
        border-left: 1px solid var(--line);
        font-size: 1.75rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        gap: 0.5rem;
        margin: 0;
        padding: 0.75rem;
        list-style: none;
      }

      .chip {
        padding: 0.3rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--page);
        overflow-wrap: anywhere;
      }

      .chip.is-new {
        animation: chip-in 600ms ease-out;
      }

      @keyframes chip-in {
        from {
          background: var(--ink);
          color: var(--page);
          transform: scale(1.15);
        }
      }

      .clear-button,
      dialog button {
        padding: 0.65rem 1.1rem;
        border: 2px solid var(--ink);
        border-radius: var(--radius);
        background: transparent;
        font-weight: 600;
        cursor: pointer;
      }

      .clear-button {
        border-color: var(--danger);
        color: var(--danger);
      }

      dialog {
        width: min(100% - 32px, 26rem);
        padding: 1.5rem;
        border: 0;
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
      }

      dialog::backdrop {
        background: rgb(28 36 51 / 0.55);
      }

      dialog h2 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
      }

      dialog p {
        margin: 0 0 1.5rem;
        color: var(--ink-soft);
      }

      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 0.75rem;
      }

      dialog .confirm-clear {
        border-color: var(--danger);
        background: var(--danger);
        color: var(--surface);
      }

      @media (max-width: 30rem) {
        .tier-letter {
          min-width: 4rem;
          font-size: 2.25rem;
        }

        .tier-count {
          min-width: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <h1>Live results</h1>
          <p class="lede" id="summary">Connecting…</p>
        </div>
        <button type="button" class="clear-button" id="open-clear">Clear votes</button>
      </div>

      <ul class="tiers" id="tiers" aria-label="Votes by rank"></ul>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <dialog id="clear-dialog" aria-labelledby="clear-title">
      <form method="dialog">
        <h2 id="clear-title">Clear all votes?</h2>
        <p>Every vote is deleted and everyone can vote again. This can't be undone.</p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>Keep votes</button>
          <button value="confirm" class="confirm-clear">Clear votes</button>
        </div>
      </form>
    </dialog>

    <script type="module">
      const basePath = location.pathname.replace(/\/+$/, "");
      const votingUrl = new URL("/", location.href).href;

      const summary = document.querySelector("#summary");
      const tierList = document.querySelector("#tiers");
      const statusLine = document.querySelector("#status");
      const clearDialog = document.querySelector("#clear-dialog");

      let previousChips = new Set();
      let currentRoundId = null;

      function setStatus(message, tone = "info") {
        statusLine.textContent = message;
        statusLine.dataset.tone = tone;
      }

      function renderSummary(voteCount) {
        const link = document.createElement("a");
        link.href = votingUrl;
        link.textContent = votingUrl;
        const lead =
          voteCount === 0 ? "No votes yet. " : `${voteCount} ${voteCount === 1 ? "person has" : "people have"} voted. `;
        summary.replaceChildren(lead, "Voting page: ", link);
      }

      function render({ roundId, ranks, ballots }) {
        // Only highlight votes that arrive while the page is open, not the board as first loaded.
        const highlightNewChips = roundId === currentRoundId;
        currentRoundId = roundId;

        const nextChips = new Set();
        const rows = ranks.map((rank) => {
          const names = ballots.filter((ballot) => ballot.rank === rank).map((ballot) => ballot.name);

          const row = document.createElement("li");
          row.className = "tier-row";
          row.dataset.rank = rank;

          const letter = document.createElement("span");
          letter.className = "tier-letter";
          letter.textContent = rank;

          const chips = document.createElement("ul");
          chips.className = "chips";
          chips.setAttribute("aria-label", `Voted ${rank}`);
          const seen = new Map();
          for (const name of names) {
            const occurrence = (seen.get(name) ?? 0) + 1;
            seen.set(name, occurrence);
            const chipKey = `${rank}\u0000${name}\u0000${occurrence}`;
            nextChips.add(chipKey);

            const chip = document.createElement("li");
            chip.className = highlightNewChips && !previousChips.has(chipKey) ? "chip is-new" : "chip";
            chip.textContent = name;
            chips.append(chip);
          }

          const count = document.createElement("span");
          count.className = "tier-count";
          count.textContent = String(names.length);
          count.setAttribute("aria-label", `${names.length} votes`);

          row.append(letter, chips, count);
          return row;
        });

        tierList.replaceChildren(...rows);
        previousChips = nextChips;
        renderSummary(ballots.length);
      }

      document.querySelector("#open-clear").addEventListener("click", () => clearDialog.showModal());

      clearDialog.addEventListener("close", async () => {
        if (clearDialog.returnValue !== "confirm") return;
        clearDialog.returnValue = "";
        try {
          const response = await fetch(`${basePath}/reset`, { method: "POST" });
          if (!response.ok) throw new Error(`Reset failed with status ${response.status}`);
          setStatus("Votes cleared. Everyone can vote again.");
        } catch (error) {
          console.error(error);
          setStatus("Votes weren't cleared because the server couldn't be reached. Try again.", "error");
        }
      });

      const events = new EventSource(`${basePath}/events`);
      events.addEventListener("open", () => {
        if (statusLine.dataset.tone === "connection") setStatus("");
      });
      events.addEventListener("error", () => setStatus("Connection lost. Reconnecting…", "connection"));
      events.addEventListener("message", (event) => render(JSON.parse(event.data)));
    </script>
  </body>
</html>
