# Site config for nginx in front of the container published on 127.0.0.1:3000.
# Replace vote.example.com and the certificate paths with your own.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vote.example.com;

    ssl_certificate     /etc/letsencrypt/live/vote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.example.com/privkey.pem;

    # Keep the secret results path out of the access log.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent event streams: /api/events and /r/<token>/events.
    # The app also sends X-Accel-Buffering: no; this block keeps the connection
    # open past nginx's 60s default and stops it from closing idle upstreams.
    location ~ /events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vote.example.com;
    return 301 https://$host$request_uri;
}
